<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong Dad - Programme personnalisé</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D2A6B">
<meta name="apple-mobile-web-app-title" content="Strong Dad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap">
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --ink:#1C221F; --ink-2:#5B645F; --line:#D9DED9;
  --accent:#0D2A6B; --accent-ink:#FFFFFF; --soft:#DFE6F5; --warn:#B4531A; --ok:#1F7A4D; --ok-soft:#DFF2E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181B1A; --surface:#222624; --ink:#EEF1EE; --ink-2:#A2ABA6; --line:#343A37;
    --accent:#5A9BE8; --accent-ink:#06142E; --soft:#182A4A; --warn:#F0955C; --ok:#5FCB8E; --ok-soft:#1E3A2B;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1A; --surface:#222624; --ink:#EEF1EE; --ink-2:#A2ABA6; --line:#343A37;
  --accent:#5A9BE8; --accent-ink:#06142E; --soft:#182A4A; --warn:#F0955C; --ok:#5FCB8E; --ok-soft:#1E3A2B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip;max-width:100vw}
main{min-width:0}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;max-width:100%;min-width:0;box-sizing:border-box}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;text-align:left}
main{max-width:640px;margin:0 auto;padding:30px 16px 28px}
@media (display-mode: standalone){ main{padding-top:36px} }
h1,h2,h3{margin:0;font-weight:800;line-height:1.05}
.display{font-variation-settings:"wdth" 70;font-weight:900;letter-spacing:-.01em}
.mark{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:4px 0 2px}
.mark .kg{font-variation-settings:"wdth" 70;font-weight:900;font-size:34px;line-height:1;color:var(--accent)}
.mark .app{font-size:14px;color:var(--ink-2)}
.meta{color:var(--ink-2);font-size:14px;line-height:1.4}
.session-title{font-size:34px;margin:22px 0 6px;line-height:1.02;letter-spacing:-.01em;overflow-wrap:anywhere}
@media (min-width:480px){.session-title{font-size:44px}}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.intro{margin:14px 0 6px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.section{margin-top:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips.days{padding-top:14px}
.chips.sub{padding-top:0}
.chip.quiet{border-style:dashed;color:var(--ink-2);font-size:13px;padding:5px 11px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;line-height:1.2}
.chips.days .chip{min-width:48px;text-align:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip[aria-pressed="true"].done::after{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.card h3{font-size:17px;margin-bottom:8px;line-height:1.25}
.pill{display:inline-block;background:var(--soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:700;line-height:1.3}
.pill.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .chk{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;margin-top:2px}
.ex.on .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ex .name{font-weight:700;font-size:16px;line-height:1.3}
.ex .rx{font-size:15px;margin-top:1px}
.ex .cue{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.ex.on .name{text-decoration:line-through;color:var(--ink-2)}
.rest{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;padding:4px 8px;border:1px solid var(--accent);border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:12px 18px;min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
.timer{font-variation-settings:"wdth" 70;font-weight:900;font-size:min(72px,18vw);line-height:1;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.timer.small{font-size:40px}
.roundsbig{font-variation-settings:"wdth" 70;font-weight:900;font-size:32px;line-height:1}
ol.plain{margin:6px 0 0;padding-left:20px}
ol.plain li{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:4px 0}
.note{font-size:14px;color:var(--ink-2)}
.warnbox{border-left:3px solid var(--warn);padding:10px 12px;background:var(--surface);border-radius:0 10px 10px 0;margin:12px 0;font-size:14px;line-height:1.45;color:var(--ink)}
.grid12{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px;align-items:center;font-size:12px}
.grid12 .cell{height:30px;min-width:0;border-radius:5px;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;line-height:1}
.grid12 .cell .up{color:#fff}.grid12 .cell .dn{color:#FFE4D1}.grid12 .cell .eq{opacity:.8}
.grid12 .cell.on{background:var(--ok)}
.grid12 .cell.opt:not(.on){background:transparent;border:1px dashed var(--line)}
.grid12 .cell.cur{outline:2px solid var(--accent);outline-offset:-2px}
.grid12 .wk{color:var(--ink-2);padding-right:6px;text-align:right}
.grid12 .hd{color:var(--ink-2);text-align:center}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kpi b{display:block;font-variation-settings:"wdth" 70;font-weight:900;font-size:26px;line-height:1;overflow-wrap:anywhere}
.kpi span{font-size:13px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{color:var(--ink-2);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.field{display:grid;gap:4px;font-size:14px}
.field span{color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
svg.chart{width:100%;height:120px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2);padding:6px 4px;border-radius:10px;letter-spacing:.01em}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restbar.show{display:flex}
.restbar b{font-variation-settings:"wdth" 70;font-weight:900;font-size:32px;font-variant-numeric:tabular-nums;line-height:1}
.restbar button{color:var(--bg);border:1px solid var(--bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:700;font-size:15px}
details.card{padding:12px 16px}
.phaseline{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0}
.phaseline i{height:8px;border-radius:2px;background:var(--line);display:block}
.phaseline i.p0{background:var(--accent);opacity:.45}.phaseline i.p1{background:var(--accent);opacity:.7}.phaseline i.p2{background:var(--accent)}
.phaseline i.cur{outline:2px solid var(--ink);outline-offset:1px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ex{grid-template-columns:28px 1fr auto}
.ex .thumb{width:100%;max-width:150px;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0 4px;cursor:zoom-in}
.ex .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:4px 8px;display:inline-block}
.upl{font-size:13px;font-weight:700;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px;padding:4px 8px;display:inline-block;cursor:pointer}
.upl input{display:none}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lib .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start}
.lib .item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.lib .item .ph{width:100%;height:120px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:12px;text-align:center;padding:8px}
.lib .item b{font-size:14px;line-height:1.2}
.guided{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin:14px 0;text-align:center}
.guided .count{font-variation-settings:"wdth" 70;font-weight:900;font-size:64px;line-height:1;color:var(--accent)}
.guided .lbl{font-size:13px;color:var(--ink-2)}
.guided .exname{font-variation-settings:"wdth" 75;font-weight:900;font-size:34px;line-height:1.05;margin:10px 0 6px}
.guided .rx{font-size:18px;font-weight:700}
.guided .cue{font-size:15px;color:var(--ink-2);margin:6px auto 0;max-width:36ch}
.guided .thumb{max-width:220px;margin:12px auto 0}
.gvid{display:block;width:100%;max-width:360px;aspect-ratio:9/12;max-height:46vh;object-fit:cover;border-radius:14px;margin:12px auto 0;background:#000}
.guided .next .gvid{max-width:260px;max-height:34vh}
.guided .next{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:left}
.guided .next .exname{font-size:26px}
.guided .btns{display:grid;gap:10px;margin-top:18px}
.guided .btn{width:100%}
.guided.rest .count{color:var(--ink)}
.progressline{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .3s}
.guided,.guided *,.card,.ex>div{min-width:0;max-width:100%}
.guided .exname,.guided .cue,.guided .rx,.ex .name,.ex .cue{overflow-wrap:anywhere;white-space:normal}
.gf{position:fixed;inset:0;z-index:14;background:var(--bg);color:var(--ink);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.gf.show{display:flex}
.gf-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;font-size:13px;color:var(--ink-2);font-weight:600}
.gf-top #gfElapsed{font-variant-numeric:tabular-nums}
.gf-top button{font-size:18px;opacity:.9;padding:2px 6px}
.gf-top button.off{opacity:.35}
.gf-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 18px;text-align:center;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.gf-body *{max-width:100%;box-sizing:border-box;min-width:0}
.gf-body .exname,.gf-body .cue,.gf-body .rx,.gf-body .lbl{overflow-wrap:anywhere;white-space:normal}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.gf .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.gf .count{font-variation-settings:"wdth" 70;font-weight:900;font-size:min(88px,22vw);line-height:1;color:var(--accent);margin:4px 0 8px;font-variant-numeric:tabular-nums}
.gf.rest .count{color:var(--ink)}
.gf .exname{font-variation-settings:"wdth" 75;font-weight:900;font-size:30px;line-height:1.05;margin:8px 0 4px;overflow-wrap:anywhere}
.gf .rx{font-size:18px;font-weight:700}
.gf .cue{font-size:15px;color:var(--ink-2);margin:8px auto 0;max-width:38ch;line-height:1.45}
.gf .gvid{margin:14px auto 0}
.gf .thumb{display:block;max-width:220px;margin:14px auto 0;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.gf .how{max-width:38ch;margin:12px auto 0;text-align:center}
.gf .how ol{text-align:left}
.gf .count.off{color:var(--ok)}
.gf .loadf{margin-top:12px}
.gf .reco{max-width:38ch;margin:6px auto 0}
.gf .donecard{background:transparent;border:1px dashed var(--line);border-radius:16px;padding:12px 16px;margin:18px 0 0;text-align:left;opacity:.9}
.gf .donecard .exname{font-size:20px;margin:2px 0 0}
.gf .donecard .fb{margin-top:8px}
.gf .nextcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:14px 16px;margin:14px 0 0;text-align:left}
.gf .lbl.accent{color:var(--accent)}
.gf .lbl.ok{color:var(--ok)}
.gf .lbl.big{font-size:15px;letter-spacing:.04em;margin-bottom:4px}
.gf .donecard{border:1px solid var(--line);border-left:4px solid var(--ok);border-style:solid;background:var(--surface);opacity:1}
.gf .donecard .exname{font-size:22px}
.gf .nextcard .exname{font-size:24px;margin:4px 0 2px}
.gf .nextcard .cue{margin:6px 0 0;max-width:none}
.fb{margin:10px 0 0}
.fb.compact{margin:8px 0 0}
.fb.compact .row{grid-template-columns:repeat(3,minmax(0,1fr));max-width:280px}
.fb.compact button{padding:6px 4px;font-size:12.5px}
.fb.compact .row{grid-template-columns:repeat(4,minmax(0,1fr));max-width:340px}
.fb button.skipbtn{color:var(--ink-2);border-style:dashed}
.fb button.skipbtn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.ex.skipped .name{text-decoration:line-through;color:var(--ink-2)}
.ex.skipped .chk{border-color:var(--warn);color:var(--warn)}
.fb .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.fb button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px}
.fb button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gf .fb{margin:16px 0 0}
.gf .fb .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gf .fb button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px}
.gf .fb button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gf-actions{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.gf-actions .btn{width:100%;min-height:54px;font-size:18px}
.gf-actions .small-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gf-actions .small-row .btn{min-height:42px;font-size:14px}
.gf .timerbox{margin-top:14px}
.reco{font-size:12.5px;margin-top:4px;font-weight:600;color:var(--ink-2)}
.reco.up{color:var(--ok)}.reco.dn{color:var(--warn)}
.recap .ex{grid-template-columns:28px 1fr 0}
.recap h3{margin:4px 0 6px}
.how{margin-top:8px;font-size:13.5px;text-align:left}
.how summary{font-weight:700;color:var(--accent);font-size:13px;cursor:pointer;list-style:none}
.how summary::before{content:'▸ '}
.how[open] summary::before{content:'▾ '}
.how ol{margin:6px 0 0;padding-left:18px;color:var(--ink)}
.how ol li{margin:3px 0;line-height:1.4}
.guided .how{max-width:36ch;margin:10px auto 0}
.loadf{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:6px}
.loadf input{width:96px;padding:6px 8px;font-size:16px}
.itemrow{display:flex;gap:10px;align-items:flex-start}
.itemrow .mini{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 auto;cursor:zoom-in}
.itemrow .cue{font-size:13px;color:var(--ink-2)}
.focus{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:15;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.focus.show{display:flex}
.focus .ftimer{font-variation-settings:"wdth" 70;font-weight:900;font-size:min(96px,22vw);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.focus .ftimer.paused{opacity:.5}
.focus .ftimer.over,.timer.over{color:var(--warn)}
.focus .frounds{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.focus .frounds b{font-variation-settings:"wdth" 70;font-weight:900;font-size:44px;line-height:1}
.focus ol{margin:8px 0 0;padding-left:20px}
.focus ol li{margin:8px 0}
.focus .fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:12px}
.focus .big{grid-column:1/-1;font-size:20px;min-height:60px}
.prep{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:end center;z-index:18;padding:16px}
.prep.show{display:grid}
.prep .box{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px}
.prep .kicker{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.prep h3{font-variation-settings:"wdth" 75;font-weight:900;font-size:30px;line-height:1.05;margin-bottom:12px}
.prep .line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.prep .line b{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding-top:3px}
.prep .btns{display:grid;gap:8px;margin-top:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:20;padding:20px}
.overlay.show{display:grid}
.overlay img{max-width:100%;max-height:80vh;border-radius:12px}
.overlay .cap{color:#fff;font-weight:700;margin-top:10px;text-align:center}

function noGripOn(){ if(!state.noGrip) return false; const t=new Date(); t.setHours(0,0,0,0); return iso(t) <= state.noGrip; }
function bx(b){ if(noGripOn() && b.ng) return b.ng; return (gymOn() && b.g) ? b.g : b; }
function placeChips(){ return `<div class="chips" style="padding-top:0"><button class="chip" aria-pressed="${!gymOn()}" data-place="home">Maison · KB 12 kg</button><button class="chip" aria-pressed="${gymOn()}" data-place="gym">Salle de sport</button>${expressChip()}</div><div class="chips sub" style="padding-top:0"><button class="chip ${noGripOn()?'':'quiet'}" aria-pressed="${noGripOn()}" data-nogrip="1">🩹 Sans grip${noGripOn()?' · jusqu\'au '+state.noGrip.slice(8,10)+'/'+state.noGrip.slice(5,7):''}</button></div>`; }
const NOLOAD = new Set(['tgu','popup','pallof','scappush','russtwist','rower','bike','hangingknee','planche','hollow','deadbug','finisherhome','mobilite','wallsit','stepdown','pont','mollets','burpee','birddog','pont1','abduction','kickback','suitcase','halo','pullapart','pullthrough','hundred','rollup','singleleg','bridgemarch','sidekick','swimming','sunsal','chair','warrior2','warrior3','crescent','bridgeyoga','boat','childs','pigeon','pompesg','pompes','pike','dips','row1']);
function hasLoadField(b0,b){ return gymOn() && !!b0.g && !NOLOAD.has(b.k); }
const LOWER = new Set(['backsquat','frontsquat','legpress','rdl','hipthrustbar','smithhipthrust','walkinglunge','bulgare','legcurl','stepupdb','hipthrustmachine','hipthrust1g','kbswing16']);
function recoFor(k){ const r=(state.lastRpe||{})[k]; if(!r) return '';
  if(r.load==null){ if(r.rpe<=6) return `<div class="reco up">Trop facile la dernière fois → ajoute 2 reps par série (ou 10 s sur les maintiens), ou passe à la variante plus dure.</div>`; if(r.rpe>=9) return `<div class="reco dn">Trop dur la dernière fois → garde le même nombre de reps, ou reviens à la variante plus facile.</div>`; return ''; }
  const step=LOWER.has(k)?5:2.5; let txt, cls='eq';
  if(r.rpe<=6){ txt='essaie '+(r.load+step)+' kg ▲'; cls='up'; } else if(r.rpe>=9){ txt='allège à '+Math.max(0,r.load-step)+' kg ▼'; cls='dn'; } else { txt='garde '+r.load+' kg ='; }
  return `<div class="reco ${cls}">Dernière fois : ${r.load} kg · ${r.rpe}/10 → ${txt}</div>`; }
function loadField(k){ state.loads=state.loads||{}; const v=state.loads[k]; return `<label class="loadf"><span>Charge</span><input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${v!=null?v:''}" data-load="${k}"></label>${recoFor(k)}`; }
function bindPlace(root){
  root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{ state.placeByDay=state.placeByDay||{}; if(curDay) state.placeByDay[curDay.id]=b.dataset.place; state.place=b.dataset.place; persist(); if(guided.active) stopGuided(); rerender(); });
  root.querySelectorAll('[data-nogrip]').forEach(b=>b.onclick=()=>{ if(noGripOn()){ if(confirm('Désactiver le mode sans grip ?')){ state.noGrip=null; persist(); rerender(); } } else { const d=prompt('Jusqu\'à quelle date ? (AAAA-MM-JJ)', iso(new Date(Date.now()+14*86400000))); if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)){ state.noGrip=d; persist(); if(guided.active) stopGuided(); rerender(); } } });
  root.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{ state.tueFocus=b.dataset.focus; applyFocus(); persist(); rerender(); });
  root.querySelectorAll('[data-express]').forEach(b=>b.onclick=()=>{ state.express=!state.express; persist(); if(guided.active) stopGuided(); stopBig(); rerender(); });
  root.querySelectorAll('[data-load]').forEach(i=>i.oninput=i.onchange=e=>{ state.loads=state.loads||{}; const v=parseFloat(e.target.value); if(isNaN(v)) delete state.loads[i.dataset.load]; else state.loads[i.dataset.load]=v; persist(); });
}

/* ===================== Durée & mode express ===================== */
function expressOn(){ return !!state.express; }
function restFor(day,ph){ const base = day.rest ? (ph===2?Math.max(45,day.rest-30):day.rest) : 45; return expressOn()? Math.min(base,45) : base; }
function setsFor(b,ph,w,day){ let n=setsOf(rxFor(b.p[ph])); if((w===4||w===8) && day.kind==='sets') n=Math.max(1,n-1); if(expressOn()) n=Math.min(n,3); return n; }
function rxShow(b,ph,w,day){ const n=setsFor(b,ph,w,day); return rxFor(b.p[ph]).replace(/^\d+(\s*×)/, (m,x)=>n+x); }
function warmMin(){ return expressOn()?3:5; }
function blocksMin(day,ph,w,list){ const r=restFor(day,ph); return list.reduce((t,x)=>{ const b=bx(x.b0); return t + setsFor(b,ph,w,day)*(45+r)/60; },0); }
function activeBlocks(day,ph,w){
  const all=day.blocks.map((b0,i)=>({b0,i})); if(!expressOn()) return all;
  const fixed = day.kind==='recovery' ? 10 : warmMin();
  const sel=[]; for(const x of all){ sel.push(x); if(sel.length>(day.kind==='recovery'?2:3) && fixed+blocksMin(day,ph,w,sel)>20){ sel.pop(); break; } } return sel;
}
function estimateMin(day,ph,w){
  if(day.kind==='rest') return 0;
  if(day.kind==='amrap') return warmMin() + (expressOn()?Math.min(day.minutes[ph],15):day.minutes[ph]);
  if(day.kind==='rounds') return warmMin() + (expressOn()?Math.min(day.cap[ph],17):day.cap[ph]);
  const run = day.kind==='recovery' ? (expressOn()?10:day.runMin[ph]) : warmMin();
  return Math.round(run + blocksMin(day,ph,w,activeBlocks(day,ph,w)));
}
function expressChip(){ return `<button class="chip" aria-pressed="${expressOn()}" data-express="1">⏱ Express 20 min</button>`; }

/* ===================== Dates ===================== */
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentWeek(){
  if(!state.start) return 1;
  const s = new Date(state.start+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  const w = Math.floor((t-s)/(7*86400000))+1;
  return Math.min(12, Math.max(0, w));
}
function programDone(){ if(!state.start) return false; const s=new Date(state.start+'T00:00:00'); const t=new Date(); return (t-s)/(7*86400000) >= 12; }
function cycleN(){ return state.cycle||1; }
function phaseOf(w){ const c=cycleN(); if(w<1) w=1; if(c===1) return w<=4?0 : w<=8?1 : 2; if(c===2) return w<=6?1:2; return 2; }
function rxFor(p){ const c=cycleN(); if(c<2) return p; const add=Math.min(c-1,2); return p.replace(/^(\d+)(\s*×)/, (m,n,x)=>Math.min(6,+n+add)+x); }
function todayIdx(){ return (new Date().getDay()+6)%7; }

let view = {tab:'today', week:null, day:null};
applyFocus();
function sessionKey(w,id){ return (cycleN()>1?'c'+cycleN()+'-':'')+'w'+w+'-'+id; }
function sessOf(w,id){ return state.sessions.find(s=>s.key===sessionKey(w,id)); }
function isDone(w,id){ return !!sessOf(w,id); }
function runDone(w,id){ const s=sessOf(w,id); return !!(s && s.run); }
function exDone(w,id){ const s=sessOf(w,id); return !!(s && s.ex && s.ex.length); }

/* ===================== Rendu ===================== */
const app = document.getElementById('app');
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===view.tab?'page':'false'));
  if(view.tab==='today') renderToday();
  else if(view.tab==='program') renderProgram();
  else if(view.tab==='progress') renderProgress();
  else renderFood();
  if(render.keep){ window.scrollTo(0,render.keep); render.keep=null; } else window.scrollTo(0,0);
}
function rerender(){ render.keep=window.scrollY; render(); }

function header(){
  const w = currentWeek(), ph = phaseOf(w);
  return `<div class="mark"><span class="kg">Strong Dad</span><span class="app">Programme personnalisé</span></div>
  <div class="meta">${state.start ? `${cycleN()>1?'Cycle '+cycleN()+' · ':''}${w===0?'Semaine 0 · prise en main, le programme démarre lundi':`Semaine ${w} sur 12 · phase ${ph+1}, ${PHASES[ph].name}`}${(w===4||w===8)?' · semaine allégée':''}${w===12?' · semaine de tests':''}` : 'Programme non démarré'}</div>`;
}

  const w = view.week ?? currentWeek();
  const dIdx = view.day ?? todayIdx();
  const day = DAYS[dIdx]; const ph = phaseOf(w); curDay=day;
  let html = header();
  if(!state.start){
    html += `<div class="card"><h3>Prêt à commencer ?</h3><p class="note">Le programme démarre le lundi de la semaine en cours. Tu peux regarder chaque journée avant de te lancer. Avant la première séance, fais les tests de départ dans l'onglet Progrès.</p><button class="btn" id="startBtn">Commencer le programme</button></div>`;
  } else if(programDone()){
    html += `<div class="card"><h3>12 semaines terminées</h3><p class="note">Refais les tests, compare avec la semaine 0, puis lance le cycle ${cycleN()+1}. Il commence directement en phase 2, avec une série de plus par exercice à la maison ; à la salle, tes charges enregistrées continuent de monter. Trois cycles = 9 mois : c'est là que le physique change vraiment.</p><button class="btn" id="restartBtn">Lancer le cycle ${cycleN()+1}</button></div>`;
  }

  if(day.kind!=='rest') html += placeChips();
  if(day.id==='mar') html += focusChips();
  html += `<h2 class="display session-title">${esc(day.title.replace(' · bonus',''))}</h2><p class="meta">${esc(day.name)} · semaine ${w} · ${esc(PHASES[ph].name)}</p><div class="pills">${day.kind!=='rest'?`<span class="pill">≈ ${estimateMin(day,ph,w)} min</span>`:''}${day.opt?'<span class="pill warn">bonus · optionnel</span>':''}${isDone(w,day.id)?'<span class="pill ok">séance faite ✓</span>':''}</div><p class="intro">${esc(day.intro)}</p>${expressOn()&&day.kind!=='rest'?`<p class="note">Mode express : l'essentiel de la séance en 20 minutes. Exercices prioritaires, 3 séries max, repos 45 s, échauffement 3 min. Une séance courte faite vaut mieux qu'une longue sautée.</p>`:''}`;

    else html += `<div class="row" style="margin:10px 0"><button class="btn ${day.kind==='recovery'?'ghost':''}" id="goBtn" style="flex:1">${day.kind==='recovery'?'Go · circuit genou (guidé)':'Go · séance guidée'}</button></div>` + `<div class="card">`+activeBlocks(day,ph,w).map(({b0,i})=>{ const b=bx(b0); return `<div class="ex ${checks[i]?'on':''} ${checks[i]===false?'skipped':''}" data-i="${i}"><button class="chk" aria-label="Valider ${esc(b.n)}" data-check="${i}">${checks[i]?'✓':(checks[i]===false?'✕':'')}</button><div><div class="name">${esc(b.n)}</div><div class="rx">${esc(rxShow(b,ph,w,day))}</div><div class="cue">${esc(b.cue)}</div>${hasLoadField(b0,b)?loadField(b.k):(b.k?recoFor(b.k):'')}${(!(day.kind==='recovery'?exDone(w,day.id):isDone(w,day.id)) && (day.kind==='sets'||day.kind==='recovery'))?fbButtons(i,true,true):''}${b.k?imgTools(b.k):''}</div>${day.kind==='sets'?`<button class="rest" data-rest="${restFor(day,ph)}">Repos ${restFor(day,ph)} s</button>`:'<span></span>'}</div>`; }).join('')+`</div>`;

  }
  if(day.kind==='rounds'){

    <div class="timer" id="bigTimer">0:00</div>

    <hr><div class="row" style="justify-content:space-between"><div><div class="note">Tours faits</div><div class="roundsbig" id="roundsNum">0</div></div><div class="row"><button class="btn ghost small" id="rMinus" aria-label="Retirer un tour compté par erreur">−1 tour</button><button class="btn small" id="rPlus">+1 tour</button></div></div></div>`;

  const blockDone = day.kind==='recovery' ? exDone(w,day.id) : isDone(w,day.id);

  if(day.kind!=='rest' && state.start && !blockDone && !(guided.active||guided.finished) && allChecked){
    html += `<div class="card"><h3>Terminer la séance</h3><p class="note">Facile / Ok / Difficile sous chaque exercice pilote la charge de la prochaine fois. Sans réponse, l'exercice est considéré « Ok ».</p><div class="stack">
      <label class="field"><span>Note (facultatif)</span><input type="text" id="snote" placeholder="ex. genou OK, dernière série dure"></label>

  /* interactions */
  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ view.day=+b.dataset.day; stopBig(); if(guided.active) stopGuided(); render(); });
  const sb=document.getElementById('startBtn'); if(sb) sb.onclick=()=>{ const td=new Date(); const dow=(td.getDay()+6)%7; const m=mondayOf(td); if(dow>=4) m.setDate(m.getDate()+7); state.start=iso(m); view.week=null; persist(); toast('Programme démarré'); render(); };
  const rb=document.getElementById('restartBtn'); if(rb) rb.onclick=()=>{ if(confirm('Lancer le cycle suivant ? Ton historique, tes charges et tes images sont conservés.')){ state.cycle=cycleN()+1; state.start=iso(mondayOf(new Date())); state.checks={}; persist(); render(); } };
  app.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{ const k=sessionKey(w,day.id); const arr=state.checks[k]||[]; const i=+b.dataset.check; arr[i]=!arr[i]; if(arr[i] && state.fbs&&state.fbs[k]&&state.fbs[k][i]==='skip') delete state.fbs[k][i]; state.checks[k]=arr; persist(); renderToday(); });

  const fb=document.getElementById('finishBtn'); if(fb) fb.onclick=()=>{

    const sess=state.sessions[state.sessions.length-1]; sess.ex=exList; const fbsAll=exList.filter(e=>e.fb); if(fbsAll.length) sess.rpe=Math.round(fbsAll.reduce((t,e)=>t+FBR[e.fb],0)/fbsAll.length);
    persist(); stopBig(); if(guided.finished) stopGuided(); toast('Séance enregistrée'); renderToday();
  };
  const shb=document.getElementById('shareBtn'); if(shb) shb.onclick=()=>{ const s=state.sessions.find(s=>s.key===sessionKey(w,day.id)); if(s) shareSession(s, day); };

  big.day=day; big.ph=ph; bindBig(); bindImages(app); bindGuided(); bindPlace(app);
  const rg=document.getElementById('runGo'); if(rg) rg.onclick=()=>showPrep(day, ph, w, ()=>runStart(day, ph, w));
  const rs=document.getElementById('runSave'); if(rs) rs.onclick=()=>{ const km=parseFloat(document.getElementById('runKm').value)||null; const bpm=parseInt(document.getElementById('runBpm').value)||null; const knee=+document.getElementById('runKnee').value; const note=document.getElementById('runNote').value.trim(); const mins=Math.round(run.elapsed/60*10)/10;
    const ex0=sessOf(w,day.id); if(ex0){ state.sessions=state.sessions.filter(s=>s!==ex0); }

/* ===================== Score de séance ===================== */
function repsOf(rx){ const m=/×\s*(\d+)/.exec(rx); return m?+m[1]:1; }
function sessionScore(day, ph, w, rounds, time){
  if(day.kind==='amrap') return rounds||0;
  if(day.kind==='rounds') return time? Math.round(-time/60*10)/10 : (rounds||0);
  if(day.kind==='sets' || day.kind==='recovery'){ let s=0; activeBlocks(day,ph,w).forEach(({b0})=>{ const b=bx(b0); const n=setsFor(b,ph,w,day), r=repsOf(rxFor(b.p[ph])); const L=(gymOn()&&b0.g&&state.loads&&state.loads[b.k])||1; s+=n*r*L; }); return Math.round(s); }
  return 0;
}
function scoreArrow(wk, id){
  const cur=state.sessions.find(s=>s.key===sessionKey(wk,id)); if(!cur || cur.score==null) return '';
  const prev=state.sessions.find(s=>s.key===sessionKey(wk-1,id)); if(!prev || prev.score==null) return '';
  if(cur.score>prev.score) return '<span class="up">▲</span>'; if(cur.score<prev.score) return '<span class="dn">▼</span>'; return '<span class="eq">=</span>';
}

/* ===================== Carte séance enregistrée + partage ===================== */
const FBL={skip:'Pas fait',easy:'Facile',ok:'Ok',hard:'Difficile'};
function savedCard(s, day){
  const ex=s.ex||[]; const fbs=ex.filter(e=>e.fb); const score=fbs.length? (fbs.reduce((t,e)=>t+({easy:1,ok:2,hard:3}[e.fb]),0)/fbs.length) : null;
  const mood = score==null?'':(score<1.5?'globalement facile → on monte':score>2.5?'globalement difficile → on consolide':'bien calibré');
  const runRow = s.run ? `<tr><td>Course ✓</td><td>${s.run.min} min${s.run.km?' · '+s.run.km+' km':''}</td><td>${s.run.bpm?s.run.bpm+' bpm':'–'}</td><td>${s.run.km?fmt(s.run.min*60/s.run.km)+'/km':''}</td></tr>` : '';
  const rows = runRow + ex.map(e=>{ const nxt = e.next ? `<span class="reco ${e.next.cls}">→ ${esc(e.next.txt)}</span>` : ''; return `<tr><td>${esc(e.n)}</td><td>${e.sets!=null?e.sets+'×':''}${e.load!=null?' '+e.load+' kg':''}</td><td>${e.fb?FBL[e.fb]:'–'}</td><td>${nxt}</td></tr>`; }).join('');
  return `<div class="card recap" id="savedCard"><div class="lbl meta">${esc(day.name)} · ${esc(s.date)}</div><h3 class="display" style="font-size:28px">Séance enregistrée</h3><div class="pills">${s.dur?`<span class="pill">${s.dur} min</span>`:''}${s.rounds?`<span class="pill">${s.rounds} tours</span>`:''}${s.time?`<span class="pill">${fmt(s.time)}</span>`:''}${s.bpm?`<span class="pill">${s.bpm} bpm</span>`:''}${mood?`<span class="pill">${mood}</span>`:''}</div>
  ${(ex.length||s.run)?`<div class="tablewrap" style="margin-top:10px"><table><tr><th>Exercice</th><th>Fait</th><th>Ressenti</th><th>Prochaine fois</th></tr>${rows}</table></div><p class="note" style="margin-top:8px">✓ Pris en compte : ces recommandations s\'afficheront automatiquement à la prochaine séance.</p>`:''}
  ${s.note?`<p class="note">${esc(s.note)}</p>`:''}
  <div class="row" style="margin-top:10px"><button class="btn small" id="shareBtn">Partager le récap</button><button class="btn ghost small" id="undoBtn">Annuler l\'enregistrement</button></div></div>`;
}
function nextReco(k){ const r=(state.lastRpe||{})[k]; if(!r) return null; if(r.load==null){ if(r.rpe<=6) return {cls:'up', txt:'+2 reps / +10 s'}; if(r.rpe>=9) return {cls:'dn', txt:'garde ou allège'}; return {cls:'eq', txt:'pareil'}; } const step=LOWER.has(k)?5:2.5; if(r.rpe<=6) return {cls:'up', txt:(r.load+step)+' kg'}; if(r.rpe>=9) return {cls:'dn', txt:Math.max(0,r.load-step)+' kg'}; return {cls:'eq', txt:r.load+' kg'}; }
async function shareSession(s, day){
  const W=1080, H=1350; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement); const accent=cs.getPropertyValue('--accent').trim()||'#333';
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,accent); g.addColorStop(1,'#111'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.08)'; x.fillRect(60,60,W-120,H-120);

let big = {int:null, remaining:0, elapsed:0, countdown:true, rounds:0, running:false, started:false, secs:0, day:null, ph:0, wake:null};
function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const focusEl=document.getElementById('focus');
function bindBig(){
  const st=document.getElementById('tStart'); if(!st) return;
  const secs=+st.dataset.secs; big.countdown = secs>0; big.secs=secs;
  if(!big.started){ big.remaining=secs; big.elapsed=0; }
  drawBig();
  st.onclick=()=>{ if(big.started){ openFocus(); tick(); } else showPrep(big.day, big.ph, currentWeek(), ()=>{ openFocus(); tick(); }); };
  document.getElementById('tPause').onclick=pauseBig;
  document.getElementById('tReset').onclick=resetBig;

  document.getElementById('rMinus').onclick=()=>{ big.rounds=Math.max(0,big.rounds-1); drawBig(); };
}
function tick(){ if(big.running) return; big.running=true; big.started=true; big.int=setInterval(()=>{ if(big.countdown){ big.remaining--; if(big.remaining>0 && big.remaining<=5) tickBeep(); if(big.remaining<=0){ clearInterval(big.int); big.running=false; big.remaining=0; beep(3); } } else big.elapsed++; drawBig(); },1000); drawBig(); }
function pauseBig(){ clearInterval(big.int); big.running=false; drawBig(); }
function resetBig(){ clearInterval(big.int); big.running=false; big.started=false; big.remaining=big.secs; big.elapsed=0; big.rounds=0; drawBig(); }
function drawBig(){ const v=big.countdown? fmt(big.remaining) : fmt(big.elapsed); const capS = (!big.countdown && big.day && big.day.cap) ? (expressOn()?Math.min(big.day.cap[big.ph],17):big.day.cap[big.ph])*60 : 0; const over = capS>0 && big.elapsed>=capS; if(over && !big.overBeeped){ big.overBeeped=true; beep(3); } if(!over) big.overBeeped=false;
  const t=document.getElementById('bigTimer'); if(t){ t.textContent=v; t.classList.toggle('over',over); } const r=document.getElementById('roundsNum'); if(r) r.textContent=big.rounds;
  const ft=document.getElementById('fTimer'); ft.textContent=v; ft.classList.toggle('paused', big.started && !big.running); ft.classList.toggle('over',over); document.getElementById('fRounds').textContent=big.rounds;
  document.getElementById('fPause').textContent = big.running?'Pause':(big.started?'Reprendre':'Démarrer'); }
function openFocus(){

}
function closeFocus(){ focusEl.classList.remove('show'); if(big.wake){ try{big.wake.release();}catch(e){} big.wake=null; } }

document.getElementById('fMinus').onclick=()=>{ big.rounds=Math.max(0,big.rounds-1); drawBig(); };

  html += `</div></div>`;

  // streak of consecutive weeks with >= NDAYS key sessions (ending at last full week)
  let streak=0; for(let wk=(w>0?w-1:0); wk>=1; wk--){ const n=state.sessions.filter(s=>s.week===wk && !(DAYS.find(d=>d.id===s.day)||{}).opt).length; if(n>=NDAYS) streak++; else break; }
  const wkSess=state.sessions.filter(s=>s.week===w); const wkMin=wkSess.reduce((t,s)=>t+(s.dur||0),0); const wkTon=wkSess.reduce((t,s)=>t+((s.score&&DAYS.find(d=>d.id===s.day)&&DAYS.find(d=>d.id===s.day).kind==='sets')?s.score:0),0);
  html += `<div class="card"><h3>Cette semaine</h3><div class="kpi"><div><b>${wkSess.length}</b><span>séances</span></div><div><b>${wkMin}</b><span>min d'entraînement</span></div><div><b>${streak}</b><span>semaines d'affilée (≥ 3 séances clés)</span></div></div></div>`;
  const logKeys=Object.keys(state.loadLog||{}).filter(k=>(state.loadLog[k]||[]).length);
  if(logKeys.length){ html += `<div class="card"><h3>Charges par exercice</h3><p class="note">Touche un exercice pour voir sa courbe. Les charges viennent de tes séances enregistrées.</p>${logKeys.map(k=>{ const L=state.loadLog[k]; const lastL=L[L.length-1]; return `<details class="how"><summary>${esc(LIBMAP[k]||k)} · ${lastL.load} kg</summary>${loadChart(k)}</details>`; }).join('')}</div>`; }
  const runs=(state.runs||[]).filter(r=>r.min);
  if(runs.length){ const withKm=runs.filter(r=>r.km); html += `<div class="card"><h3>Courses</h3><div class="tablewrap"><table><tr><th>Date</th><th>Temps</th><th>km</th><th>Allure</th><th>BPM</th><th>Genou</th></tr>${runs.slice(-8).reverse().map(r=>`<tr><td>${esc(r.d)}</td><td>${r.min} min</td><td>${r.km??'–'}</td><td>${r.km?fmt(r.min*60/r.km)+'/km':'–'}</td><td>${r.bpm??'–'}</td><td>${r.knee??'–'}</td></tr>`).join('')}</table></div>${withKm.length>1?'<div class="note" style="margin-top:8px">Allure (min/km, plus bas = plus vite)</div>'+seriesChart(withKm.map(r=>({x:'S'+r.w,v:Math.round(r.min/r.km*100)/100})),true):''}${runs.filter(r=>r.bpm).length>1?'<div class="note" style="margin-top:8px">BPM moyen</div>'+seriesChart(runs.filter(r=>r.bpm).map(r=>({x:'S'+r.w,v:r.bpm}))):''}</div>`; }
  const bpmS=state.sessions.filter(s=>s.bpm||(s.run&&s.run.bpm)).map(s=>({x:'S'+s.week, v:s.bpm||s.run.bpm}));
  if(bpmS.length>1) html += `<div class="card"><h3>BPM moyen par séance</h3>${seriesChart(bpmS)}</div>`;
  const last = state.tests[state.tests.length-1];
  html += `<div class="card"><h3>Tests</h3><p class="note">À faire avant de commencer (semaine 0), puis dimanche des semaines 4, 8 et 12. Échauffe-toi, repose-toi 3 min entre chaque test.</p>
  <div class="stack">
  <div class="two"><label class="field"><span>Semaine</span><input type="number" id="tWeek" min="0" max="12" value="${state.start?(last&&last.week===w?w:Math.max(0,w-(w%4===0?0:w%4))) :0}"></label><label class="field"><span>Poids (kg)</span><input type="number" id="t_weight" step="0.1" value="${state.weight}"></label></div>
  <div class="two"><label class="field"><span>Pompes max</span><input type="number" id="t_pushups" placeholder="40"></label><label class="field"><span>Swings en 5 min</span><input type="number" id="t_swings" placeholder="ex. 120"></label></div>
  <div class="two"><label class="field"><span>Planche (s)</span><input type="number" id="t_plank"></label><label class="field"><span>Goblet squats en 2 min</span><input type="number" id="t_squats"></label></div>
  <button class="btn" id="saveTest">Enregistrer les tests</button></div></div>`;
  if(state.tests.length){
    html += `<div class="card"><h3>Évolution</h3>`;
    html += chart('Pompes max','pushups') + chart('Poids (kg)','weight') + chart('Swings en 5 min','swings');
    html += `<div class="tablewrap"><table><tr><th>Sem.</th>${TESTS.map(t=>`<th>${esc(t.label.split(' ')[0])}</th>`).join('')}<th></th></tr>`;
    state.tests.forEach((t,i)=>{ html += `<tr><td>${t.week}</td>${TESTS.map(x=>`<td>${t[x.k]??'–'}</td>`).join('')}<td><button class="btn ghost small" data-del="${i}">✕</button></td></tr>`; });
    html += `</table></div></div>`;
  }
  if(state.sessions.length){
    html += `<div class="card"><h3>Dernières séances</h3><div class="tablewrap"><table><tr><th>Date</th><th>Séance</th><th>Diff.</th><th>Note</th></tr>`;
    state.sessions.slice(-8).reverse().forEach(s=>{ const d=DAYS.find(x=>x.id===s.day); html += `<tr><td>${esc(s.date)}</td><td>S${s.week} ${esc(d?d.title:s.day)}${s.rounds?` · ${s.rounds} t.`:''}${s.time?` · ${fmt(s.time)}`:''}</td><td>${s.rpe}</td><td>${esc(s.note||'')}</td></tr>`; });
    html += `</table></div></div>`;
  }
  html += `<div class="card"><h3>Données</h3><p class="note">Tes séances et tests sont enregistrés pour toi seul.</p><label class="field" style="margin-bottom:10px"><span>Lundi de départ du programme</span><input type="date" id="startIn" value="${state.start||''}"></label><p class="note">Safari et l'icône de l'écran d'accueil ont chacun leur mémoire. Pour passer tes séances de l'un à l'autre : « Copier mes données » d'un côté, « Importer » de l'autre.</p><div class="row" style="margin-bottom:12px"><button class="btn ghost small" id="exportBtn">Copier mes données</button><button class="btn ghost small" id="importBtn">Importer des données</button></div><button class="btn ghost small" id="resetAll">Tout effacer</button></div>`;
  app.innerHTML = html;
  document.getElementById('saveTest').onclick=()=>{
    const t={week:+document.getElementById('tWeek').value, date:iso(new Date())};
    TESTS.forEach(x=>{ const v=document.getElementById('t_'+x.k).value; if(v!=='') t[x.k]=+v; });
    if(t.weight) state.weight=t.weight;
    state.tests.push(t); state.tests.sort((a,b)=>a.week-b.week); persist(); toast('Tests enregistrés'); renderProgress();
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ state.tests.splice(+b.dataset.del,1); persist(); renderProgress(); });
  const eb=document.getElementById('exportBtn'); if(eb) eb.onclick=async()=>{ const txt=JSON.stringify(state); try{ await navigator.clipboard.writeText(txt); toast('Données copiées dans le presse-papiers'); }catch(e){ prompt('Copier mes données', txt); } };
  const ib=document.getElementById('importBtn'); if(ib) ib.onclick=()=>{ const txt=prompt('Colle ici les données copiées depuis l\'autre version de l\'app :'); if(!txt) return; try{ const d=JSON.parse(txt); if(!d||typeof d!=='object'||!Array.isArray(d.sessions)) throw 0; const keys={}; (state.sessions||[]).forEach(s=>keys[s.key]=1); d.sessions.forEach(s=>{ if(!keys[s.key]) state.sessions.push(s); }); state.tests=[...(state.tests||[]),...(d.tests||[]).filter(t=>!(state.tests||[]).some(x=>x.week===t.week&&x.date===t.date))].sort((a,b)=>a.week-b.week); state.loads=Object.assign({},d.loads||{},state.loads||{}); state.runs=[...(state.runs||[]),...(d.runs||[]).filter(r=>!(state.runs||[]).some(x=>x.d===r.d&&x.min===r.min))]; state.loadLog=Object.assign({},d.loadLog||{},state.loadLog||{}); state.fbs=Object.assign({},d.fbs||{},state.fbs||{}); state.lastRpe=Object.assign({},d.lastRpe||{},state.lastRpe||{}); state.checks=Object.assign({},d.checks||{},state.checks||{}); if(d.start && d.start!==state.start){ if(!state.start || confirm('Les données importées ont une autre date de départ. Utiliser '+d.start+' ?')) state.start=d.start; } if(d.cycle) state.cycle=Math.max(state.cycle||1,d.cycle); persist(); toast('Données importées'); render(); }catch(e){ toast('Données illisibles'); } };
  const si=document.getElementById('startIn'); if(si) si.onchange=e=>{ if(e.target.value){ state.start=iso(mondayOf(new Date(e.target.value+'T00:00:00'))); persist(); render(); } };
  document.getElementById('resetAll').onclick=()=>{ if(confirm('Effacer tout l\'historique et redémarrer ?')){ state={start:null, weight:state.weight, checks:{}, sessions:[], tests:[], amrapRounds:{}, images:state.images||{}, place:state.place, loads:state.loads||{}, cycle:1}; persist(); render(); } };
}
function seriesChart(pts, pace){ if(pts.length<2) return ''; const W=320,H=110,p=18; const vals=pts.map(t=>t.v); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;} const x=i=>p+i*(W-2*p)/(pts.length-1), y=v=>H-p-(v-mn)*(H-2*p)/(mx-mn); return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><polyline points="${pts.map((t,i)=>`${x(i)},${y(t.v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t.v)}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(t.v)-9}" font-size="11" text-anchor="middle" fill="var(--ink)">${pace?fmt(t.v*60):t.v}</text><text x="${x(i)}" y="${H-3}" font-size="10" text-anchor="middle" fill="var(--ink-2)">${t.x}</text>`).join('')}</svg>`; }
function loadChart(k){ const L=(state.loadLog||{})[k]||[]; if(L.length<2) return `<p class="note">${L.length?L[0].d+' · '+L[0].load+' kg':''}</p>`; const W=320,H=110,p=18; const vals=L.map(x=>x.load); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;} const x=i=>p+i*(W-2*p)/(L.length-1), y=v=>H-p-(v-mn)*(H-2*p)/(mx-mn); return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><polyline points="${L.map((t,i)=>`${x(i)},${y(t.load)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${L.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t.load)}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(t.load)-9}" font-size="11" text-anchor="middle" fill="var(--ink)">${t.load}</text><text x="${x(i)}" y="${H-3}" font-size="10" text-anchor="middle" fill="var(--ink-2)">S${t.w}</text>`).join('')}</svg>`; }
function chart(title,key){
  const pts = state.tests.filter(t=>t[key]!=null); if(pts.length<2) return '';
  const W=320,H=110,p=18; const vals=pts.map(t=>t[key]); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;}
  const x=i=>p+i*(W-2*p)/(pts.length-1), y=v=>H-p-(v-mn)*(H-2*p)/(mx-mn);
  const line=pts.map((t,i)=>`${x(i)},${y(t[key])}`).join(' ');
  return `<div class="note" style="margin-top:8px">${esc(title)}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t[key])}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(t[key])-9}" font-size="11" text-anchor="middle" fill="var(--ink)">${t[key]}</text><text x="${x(i)}" y="${H-3}" font-size="10" text-anchor="middle" fill="var(--ink-2)">S${t.week}</text>`).join('')}</svg>`;
}

/* ===================== Nutrition ===================== */
function renderFood(){
  const kg = state.weight||75;
  const pMin=Math.round(kg*1.6), pMax=Math.round(kg*2.0);
  const kMin=Math.round(kg*33/50)*50, kMax=Math.round(kg*37/50)*50;
  let html = header();
  html += `<h2 class="display session-title">Manger pour construire</h2>
  <p>Le physique vient de l'assiette autant que des séances. Simple et répétitif, c'est ce qui tient. Objectif pour toi : construire du muscle sans prendre de gras, ce qu'on appelle une recomposition. À ton niveau de départ, c'est tout à fait faisable.</p>
  <div class="card"><label class="field"><span>Ton poids actuel (kg)</span><input type="number" id="wIn" step="0.1" value="${kg}"></label></div>
  <div class="kpi"><div><b>${pMin}–${pMax} g</b><span>protéines par jour</span></div><div><b>${kMin}–${kMax}</b><span>kcal par jour, estimation</span></div><div><b>+0,25 kg</b><span>par semaine, maximum</span></div></div>
  <div class="card"><h3>Comment ajuster</h3><ul class="plain">
  <li>Pèse-toi 2 à 3 matins par semaine, à jeun, et regarde la moyenne. Elle stagne 2 semaines → ajoute 150 à 200 kcal. Elle monte de plus de 0,5 kg par semaine → retire-en autant.</li>
  <li>Les protéines sont la seule cible à tenir tous les jours. Le reste, c'est une estimation à ajuster avec la balance.</li>
  <li>Répartis les protéines sur 3 ou 4 repas, 30 à 45 g à chaque fois.</li></ul></div>
  <div class="card"><h3>Une journée type</h3><ul class="plain">
  <li><b>Petit-déj :</b> le smoothie, ou 3 œufs + pain complet, ou un bol de skyr (au moins 30 g de protéines). Flocons de sarrasin ou de quinoa si tu veux du croquant sans avoine.</li>
  <li><b>Déjeuner :</b> 150 à 200 g de poulet, dinde, bœuf maigre ou poisson + riz ou pommes de terre + légumes.</li>
  <li><b>Collation :</b> fromage blanc ou skyr, une poignée de noix, un fruit.</li>
  <li><b>Dîner :</b> même logique que le déjeuner, en variant la source.</li>
  <li><b>Le dimanche :</b> cuisine en lot 4 à 5 portions de viande et de féculents. Plus le plan est simple, plus il tient.</li></ul></div>
  <div class="card"><h3>Compléments</h3><p class="note">Ce qui a des preuves solides et suffit largement. Le reste est du marketing.</p><ul class="plain">
  <li><b>Créatine monohydrate</b> : 3 à 5 g par jour, tous les jours, entraînement ou pas. Le complément le mieux étudié pour la force et la masse.</li>
  <li><b>Whey ou protéine en poudre</b> : seulement si tu n'atteins pas ${pMin} g par l'alimentation. C'est de la nourriture pratique, pas de la magie.</li>
  <li><b>Caféine</b> : un café 30 à 45 min avant la séance si tu manques d'énergie. Pas après 15 h pour protéger le sommeil.</li>
  <li><b>Vitamine D</b> : utile d'octobre à mars sous nos latitudes ; demande à ton médecin un dosage si tu hésites.</li>
  <li>Pré-workouts, brûleurs, BCAA : tu peux t'en passer.</li></ul>
  <p class="note">Si tu as un problème de santé, un traitement ou des reins fragiles, valide la créatine et l'apport en protéines avec ton médecin.</p></div>
  <div class="card"><h3>Six repas simples, 30 à 45 g de protéines</h3><ul class="plain">
  <li><b>Smoothie du matin</b> : 1 scoop de whey, 1 cup de lait d'amande, 1 banane, 2 dattes, 1 c. à soupe de beurre de cacahuète, 1 c. à café de chia, glaçons → 31 g, 500 kcal. Dattes en option les jours de repos.</li>
  <li><b>Œufs brouillés</b> : 3 œufs + 50 g de jambon ou saumon fumé, 2 tranches de pain complet → 35 g.</li>
  <li><b>Poulet riz brocoli</b> : 180 g de poulet, 150 g de riz cuit, brocoli, huile d'olive → 45 g. Cuis 4 portions le dimanche.</li>
  <li><b>Pâtes au thon</b> : 100 g de pâtes crues, 1 boîte de thon (140 g égoutté), sauce tomate, parmesan → 42 g.</li>
  <li><b>Bœuf haché 5 % et patates</b> : 150 g de steak haché, 300 g de pommes de terre, légumes → 40 g.</li>
  <li><b>Bol skyr</b> : 250 g de skyr, 1 banane ou fruits rouges, 20 g d'amandes, 1 c. à soupe de miel → 35 g, 480 kcal.</li></ul>
  <p class="note">Chaque repas ≈ 500 à 700 kcal. Trois de ces repas + une collation = tes 130 à 150 g.</p></div>
  <div class="card"><h3>Ce qu'un nutritionniste du sport ajouterait</h3><ul class="plain">
  <li>Les glucides ne sont pas l'ennemi : riz, pâtes, pommes de terre, pain, fruits, surtout autour des séances de salle. Pas de low-carb avec ce programme.</li>
  <li>25 à 30 g de fibres par jour (légumes à chaque repas, fruits, légumineuses, céréales complètes) : digestion, satiété, santé.</li>
  <li>Les estimations de calories sont des points de départ ; la balance sur 2 à 3 semaines est le seul vrai juge.</li>
  <li>Une prise de sang annuelle (vitamine D, fer, bilan lipidique) vaut mieux que n'importe quel complément à l'aveugle.</li></ul></div>
  <div class="card"><h3>Sources scientifiques</h3><p class="note">Les références derrière chaque recommandation, pour les vérifier ou les montrer à un professionnel.</p><ul class="plain">
  <li><b>Créatine, établi</b> : Kreider et al., 2017, <i>Journal of the ISSN</i>, position officielle sur la sécurité et l'efficacité. Antonio et al., 2021, <i>Journal of the ISSN</i>, idées reçues (dont la rétention d'eau). Kazeminasab et al., 2025, <i>Nutrients</i>, méta-analyse force et puissance. Gu et al., 2026, <i>Frontiers in Nutrition</i>, méta-analyse de 37 essais chez les 18–30 ans : force et masse maigre, surtout avec musculation.</li>
  <li><b>Créatine, en cours d'étude</b> : cerveau et humeur. Eckert et al., 2025, <i>British Journal of Nutrition</i>, effet faible à modéré sur les symptômes dépressifs mais preuves de faible qualité. Cognition : résultats contestés (avis EFSA 2024, commentaire Citherlet 2026). Prometteur, pas démontré comme pour le muscle.</li>
  <li><b>Protéines, dose</b> : Morton et al., 2018, <i>British Journal of Sports Medicine</i>, méta-analyse : les gains plafonnent autour de 1,6 g/kg, avec une marge jusqu'à 2,2. Jäger et al., 2017, <i>Journal of the ISSN</i>, position officielle protéines et exercice.</li>
  <li><b>Protéines, répartition</b> : Schoenfeld & Aragon, 2018, <i>Journal of the ISSN</i>, 0,4 g/kg par repas sur 3 à 4 repas.</li>
  <li><b>Vitamine D</b> : Owens et al., 2018, <i>Sports Medicine</i>, vitamine D et sportif.</li>
  <li><b>Caféine</b> : Guest et al., 2021, <i>Journal of the ISSN</i>, position officielle caféine et performance.</li></ul>
  <p class="note">Toutes sont en accès libre. Cherche « auteur année titre du journal » pour les retrouver.</p></div>
  <div class="card"><h3>Le reste du lifestyle</h3><ul class="plain"><li>Sommeil 7 à 9 h : c'est là que le muscle se construit. Pas de compromis.</li><li>Marche 8 000 à 10 000 pas par jour, sans impact pour le genou.</li><li>Eau : 2,5 à 3 L les jours d'entraînement.</li><li>Alcool : le moins possible, il freine directement la récupération.</li></ul></div>`;
  app.innerHTML = html;
  document.getElementById('wIn').onchange=e=>{ state.weight=+e.target.value||75; persist(); renderFood(); };
}
